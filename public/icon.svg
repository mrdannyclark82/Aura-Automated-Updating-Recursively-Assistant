<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#070a1e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="512" height="512" rx="108" fill="#070a1e" />

  <!-- Ambient glow orb -->
  <circle cx="256" cy="256" r="180" fill="url(#auraGlow)" />

  <!-- Gyroscope orbits -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="24 16" opacity="0.6" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#a855f7" stroke-width="5" stroke-dasharray="18 12" opacity="0.7" />

  <!-- Core Neural Nexus -->
  <circle cx="256" cy="256" r="64" fill="url(#coreGrad)" filter="url(#blurFilter)" />
  <circle cx="256" cy="256" r="32" fill="#ffffff" opacity="0.9" />

  <!-- Radiating neural pulses -->
  <line x1="256" y1="96" x2="256" y2="140" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="372" x2="256" y2="416" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="96" y1="256" x2="140" y2="256" stroke="#a855f7" stroke-width="8" stroke-linecap="round" />
  <line x1="372" y1="256" x2="416" y2="256" stroke="#a855f7" stroke-width="8" stroke-linecap="round" />
</svg>
