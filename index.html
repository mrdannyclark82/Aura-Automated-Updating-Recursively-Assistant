<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aura" />
    <title>Aura: The Self-Improving AI Assistant</title>
    <meta name="description" content="A state-of-the-art, autonomous virtual assistant that formulates, executes, and refines plans to achieve user-defined goals. Featuring a modern UI and a dynamic visual representation of the AI's cognitive states." />
    <meta property="og:title" content="Aura: The Self-Improving AI Assistant" />
    <meta property="og:description" content="A state-of-the-art, autonomous virtual assistant that formulates, executes, and refines plans to achieve user-defined goals. Featuring a modern UI and a dynamic visual representation of the AI's cognitive states." />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #070a1e;
        overflow: hidden;
      }
      
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* CHAT BUBBLE TYPING INDICATOR */
      @keyframes typing-pulse {
        50% { background-color: transparent; }
      }
      .animate-typing-pulse {
        animation: typing-pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      
      /* UTILITY for fade-in */
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      /* SCROLLBAR STYLES */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(56, 189, 248, 0.25);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(56, 189, 248, 0.5);
      }
    </style>
  </head>
  <body class="bg-[#070a1e] text-white font-sans antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
